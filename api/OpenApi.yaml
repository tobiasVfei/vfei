      summary: Verknüpfung löschen (via ?id=X)
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: ID der Verknüpfung
      responses:
        "200":
          description: Verknüpfung erfolgreich gelöscht

  # Endpunkt: LEHRBETRIEB_LERNENDE (Verbindungstabelle)
  /Lehrbetrieb_Lernende.php:
    get:
      tags:
        - Verbindungen
      summary: Alle Lehrbetrieb-Lernenden-Verknüpfungen abrufen (oder Einzelne per ?id=X)
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: integer
          description: ID der Verknüpfung (optional)
