openapi: 3.0.0
info:
  title: Modul 295 Kursverwaltung REST API
  description: RESTful Backend zur Verwaltung von Lernenden, Dozenten und Kursen.
  version: "1.0.0"
servers:
  # Passe diesen Pfad ggf. an deine Ordnerstruktur an (z.B. /api/src)
  - url: http://localhost/api/src
    description: Lokaler Entwicklungsserver

# =========================================================================
# SICHERHEIT & DATENMODELLE
# =========================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # --- LOGIN & BENUTZER ---
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "secret123"
      required:
        - email
        - password

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        expires_in:
          type: integer

    Benutzer:
      type: object
      properties:
        id_benutzer:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - email

    # --- HAUPT-ENTITÄTEN ---
    Country:
      type: object
      properties:
        id_country:
          type: integer
          readOnly: true
        country:
          type: string
      required:
        - country

    Lehrbetrieb:
      type: object
      properties:
        id_lehrbetrieb:
          type: integer
          readOnly: true
        firma:
          type: string
        strasse:
          type: string
        plz:
          type: string
        ort:
          type: string
      required:
        - firma
        - strasse
        - plz
        - ort

    Lernender:
      type: object
      properties:
        id_lernende:
          type: integer
          readOnly: true
        vorname:
          type: string
        nachname:
          type: string
        strasse:
          type: string
        plz:
          type: string
        ort:
          type: string
        nr_land:
          type: integer
        email:
          type: string
          format: email
        birthdate:
          type: string
          format: date
      required:
        - vorname
        - nachname
        - strasse
        - plz
        - ort
        - nr_land
        - email
        - birthdate

    Dozent:
      type: object
      properties:
        id_dozent:
          type: integer
          readOnly: true
        vorname:
          type: string
        nachname:
          type: string
        strasse:
          type: string
        plz:
          type: string
        ort:
          type: string
        nr_land:
          type: integer
        email:
          type: string
          format: email
      required:
        - vorname
        - nachname
        - strasse
        - plz
        - ort
        - nr_land
        - email

    Kurs:
      type: object
      properties:
        id_kurs:
          type: integer
          readOnly: true
        kursnummer:
          type: string
        kursthema:
          type: string
        inhalt:
          type: string
        nr_dozent:
          type: integer
        startdatum:
          type: string
          format: date
        enddatum:
          type: string
          format: date
        dauer:
          type: string # Korrigiert: Entspricht dem VARCHAR(50) Typ in der DB
      required:
        - kursnummer
        - kursthema
        - inhalt
        - nr_dozent
        - startdatum
        - enddatum
        - dauer

    # --- VERKNÜPFUNGEN ---
    KursLernender:
      type: object
      properties:
        id_kurse_lernende:
          type: integer
          readOnly: true
        nr_kurs:
          type: integer
        nr_lernende:
          type: integer
        note:
          type: string # Korrigiert: Entspricht der 'string' Validierungsregel im Controller
      required:
        - nr_kurs
        - nr_lernende

    LehrbetriebLernender:
      type: object
      properties:
        id_lehrbetrieb_lernende:
          type: integer
          readOnly: true
        nr_lehrbetrieb:
          type: integer
        nr_lernende:
          type: integer
        start:
          type: string
          format: date
        ende:
          type: string
          format: date
        beruf:
          type: string
      required:
        - nr_lehrbetrieb
        - nr_lernende
        - start
        - ende

# =========================================================================
# ENDPUNKTE (PATHS)
# =========================================================================
paths:
  # --- AUTH ---
  /login:
    post:
      tags: [Auth]
      summary: Login (Token erhalten)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Erfolgreich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  # --- BENUTZER ---
  /benutzer:
    get:
      tags: [Benutzer]
      summary: Alle Benutzer auflisten
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Benutzer'
    post:
      tags: [Benutzer]
      summary: Neuen Benutzer anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Benutzer'
      responses:
        "201":
          description: Created

  /benutzer/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Benutzer]
      summary: Einzelnen Benutzer abrufen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Benutzer'
    put:
      tags: [Benutzer]
      summary: Benutzer aktualisieren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Benutzer'
      responses:
        "200":
          description: Updated
    delete:
      tags: [Benutzer]
      summary: Benutzer löschen
      responses:
        "200":
          description: Deleted

  # --- DOZENTEN ---
  /dozenten:
    get:
      tags: [Dozenten]
      security: [{bearerAuth: []}]
      summary: Liste aller Dozenten
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dozent'
    post:
      tags: [Dozenten]
      security: [{bearerAuth: []}]
      summary: Dozent erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dozent'
      responses:
        "201":
          description: Created

  /dozenten/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Dozenten]
      security: [{bearerAuth: []}]
      summary: Dozent abrufen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dozent'
    put:
      tags: [Dozenten]
      security: [{bearerAuth: []}]
      summary: Dozent aktualisieren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dozent'
      responses:
        "200":
          description: Updated
    delete:
      tags: [Dozenten]
      security: [{bearerAuth: []}]
      summary: Dozent löschen
      responses:
        "200":
          description: Deleted

  # --- KURSE ---
  /kurse:
    get:
      tags: [Kurse]
      security: [{bearerAuth: []}]
      summary: Liste aller Kurse
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Kurs'
    post:
      tags: [Kurse]
      security: [{bearerAuth: []}]
      summary: Kurs erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Kurs'
      responses:
        "201":
          description: Created

  /kurse/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Kurse]
      security: [{bearerAuth: []}]
      summary: Kurs abrufen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Kurs'
    put:
      tags: [Kurse]
      security: [{bearerAuth: []}]
      summary: Kurs aktualisieren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Kurs'
      responses:
        "200":
          description: Updated
    delete:
      tags: [Kurse]
      security: [{bearerAuth: []}]
      summary: Kurs löschen
      responses:
        "200":
          description: Deleted

  # --- KURSE-LERNENDE ---
  /kurse_lernende:
    post:
      tags: [Kurse-Lernende]
      security: [{bearerAuth: []}]
      summary: Verknüpfung erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KursLernender'
      responses:
        "201":
          description: Created
    get:
      tags: [Kurse-Lernende]
      security: [{bearerAuth: []}]
      summary: Liste der Kurs-Lernenden Verknüpfungen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KursLernender'

  /kurse_lernende/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Kurse-Lernende]
      security: [{bearerAuth: []}]
      summary: Einzelne Verknüpfung abrufen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KursLernender'
    put:
      tags: [Kurse-Lernende]
      security: [{bearerAuth: []}]
      summary: Verknüpfung aktualisieren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KursLernender'
      responses:
        "200":
          description: Updated
    delete:
      tags: [Kurse-Lernende]
      security: [{bearerAuth: []}]
      summary: Verknüpfung löschen
      responses:
        "200":
          description: Deleted

  # --- LÄNDER ---
  /laender:
    get:
      tags: [Länder]
      security: [{bearerAuth: []}]
      summary: Alle Länder auflisten
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
    post:
      tags: [Länder]
      security: [{bearerAuth: []}]
      summary: Neues Land erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Country'
      responses:
        "201":
          description: Created

  /laender/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Länder]
      security: [{bearerAuth: []}]
      summary: Einzelnes Land abrufen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Country'
    put:
      tags: [Länder]
      security: [{bearerAuth: []}]
      summary: Land aktualisieren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Country'
      responses:
        "200":
          description: Updated
    delete:
      tags: [Länder]
      security: [{bearerAuth: []}]
      summary: Land löschen
      responses:
        "200":
          description: Deleted

  # --- LEHRBETRIEBE ---
  /lehrbetriebe:
    get:
      tags: [Lehrbetriebe]
      security: [{bearerAuth: []}]
      summary: Alle Lehrbetriebe auflisten
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lehrbetrieb'
    post:
      tags: [Lehrbetriebe]
      security: [{bearerAuth: []}]
      summary: Erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lehrbetrieb'
      responses:
        "201":
          description: Created

  /lehrbetriebe/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Lehrbetriebe]
      security: [{bearerAuth: []}]
      summary: Einzelnen Betrieb abrufen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lehrbetrieb'
    put:
      tags: [Lehrbetriebe]
      security: [{bearerAuth: []}]
      summary: Betrieb aktualisieren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lehrbetrieb'
      responses:
        "200":
          description: Updated
    delete:
      tags: [Lehrbetriebe]
      security: [{bearerAuth: []}]
      summary: Betrieb löschen
      responses:
        "200":
          description: Deleted

  # --- LEHRBETRIEB-LERNENDE ---
  /lehrbetrieb_lernende:
    post:
      tags: [Lehrbetrieb-Lernende]
      security: [{bearerAuth: []}]
      summary: Verknüpfung erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LehrbetriebLernender'
      responses:
        "201":
          description: Created
    get:
      tags: [Lehrbetrieb-Lernende]
      security: [{bearerAuth: []}]
      summary: Liste der Lehrbetrieb-Lernende Verknüpfungen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LehrbetriebLernender'

  /lehrbetrieb_lernende/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Lehrbetrieb-Lernende]
      security: [{bearerAuth: []}]
      summary: Einzelne Verknüpfung abrufen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LehrbetriebLernender'
    put:
      tags: [Lehrbetrieb-Lernende]
      security: [{bearerAuth: []}]
      summary: Verknüpfung aktualisieren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LehrbetriebLernender'
      responses:
        "200":
          description: Updated
    delete:
      tags: [Lehrbetrieb-Lernende]
      security: [{bearerAuth: []}]
      summary: Verknüpfung löschen
      responses:
        "200":
          description: Deleted

  # --- LERNENDE ---
  /lernende:
    get:
      tags: [Lernende]
      security: [{bearerAuth: []}]
      summary: Alle Lernenden auflisten
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lernender'
    post:
      tags: [Lernende]
      security: [{bearerAuth: []}]
      summary: Erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lernender'
      responses:
        "201":
          description: Created

  /lernende/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Lernende]
      security: [{bearerAuth: []}]
      summary: Einzelnen Lernenden abrufen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lernender'
    put:
      tags: [Lernende]
      security: [{bearerAuth: []}]
      summary: Aktualisieren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lernender'
      responses:
        "200":
          description: Updated
    delete:
      tags: [Lernende]
      security: [{bearerAuth: []}]
      summary: Löschen
      responses:
        "200":
          description: Deleted