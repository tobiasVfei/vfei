openapi: 3.0.0
info:
  title: Modul 295 Kursverwaltung REST API
  description: RESTful Backend zur Verwaltung von Lernenden, Dozenten und Kursen. Implementiert alle CRUD-Operationen.
  version: "1.0.0"
servers:
  - url: http://localhost/api/src
    description: Lokaler Entwicklungsserver

# =========================================================================
# SCHEMATA (Datenstrukturen)
# =========================================================================
components:
  schemas:
    Country:
      type: object
      properties:
        id_country:
          type: integer
          format: int32
          readOnly: true
        country:
          type: string
          description: Name des Landes (z.B. Schweiz, Deutschland)
      required:
        - country

    Lehrbetrieb:
      type: object
      properties:
        id_lehrbetrieb:
          type: integer
          format: int32
          readOnly: true
        firma:
          type: string
        strasse:
          type: string
        plz:
          type: string
        ort:
          type: string
        land_id:
          type: integer
          format: int32
          description: Foreign Key zur tbl_countries (Wird als land_id gesendet)
      required:
        - firma
        - strasse
        - plz
        - ort
        - land_id

    Lernender:
      type: object
      properties:
        id_lernende:
          type: integer
          format: int32
          readOnly: true
        vorname:
          type: string
        nachname:
          type: string
        strasse:
          type: string
        plz:
          type: string
        ort:
          type: string
        fk_id_land:
          type: integer
          format: int32
        email:
          type: string
          format: email
        email_privat:
          type: string
          format: email
          nullable: true
        birthdate:
          type: string
          format: date
        geschlecht:
          type: string
          nullable: true
        telefon:
          type: string
          nullable: true
        handy:
          type: string
          nullable: true
      required:
        - vorname
        - nachname
        - strasse
        - plz
        - ort
        - fk_id_land
        - email
        - birthdate

    Dozent:
      type: object
      properties:
        id_dozent:
          type: integer
          format: int32
          readOnly: true
        vorname:
          type: string
        nachname:
          type: string
        strasse:
          type: string
        plz:
          type: string
        ort:
          type: string
        fk_id_land:
          type: integer
          format: int32
        email:
          type: string
          format: email
        telefon:
          type: string
          nullable: true
        handy:
          type: string
          nullable: true
        birthdate:
          type: string
          format: date
          nullable: true
      required:
        - vorname
        - nachname
        - strasse
        - plz
        - ort
        - fk_id_land
        - email

    Kurs:
      type: object
      properties:
        id_kurs:
          type: integer
          format: int32
          readOnly: true
        kursnummer:
          type: string
        kursthema:
          type: string
        inhalt:
          type: string
        fk_id_dozent:
          type: integer
          format: int32
        startdatum:
          type: string
          format: date
        enddatum:
          type: string
          format: date
        dauer:
          type: string
      required:
        - kursnummer
        - kursthema
        - inhalt
        - fk_id_dozent
        - startdatum
        - enddatum
        - dauer

    # Verbindungstabellen-Schemas
    KursLernender:
      type: object
      properties:
        id_kurse_lernende:
          type: integer
          format: int32
          readOnly: true
        # ACHTUNG: Der PHP-Input erwartet 'nr_kurs' und 'nr_lernende'
        nr_kurs:
          type: integer
          format: int32
          description: ID des Kurses (tbl_kurse.id_kurs)
        nr_lernende:
          type: integer
          format: int32
          description: ID des Lernenden (tbl_lernende.id_lernende)
        note:
          type: string
          nullable: true
      required:
        - nr_kurs
        - nr_lernende

    LehrbetriebLernender:
      type: object
      properties:
        id_lehrbetrieb_lernende:
          type: integer
          format: int32
          readOnly: true
        fk_id_lehrbetrieb:
          type: integer
          format: int32
        fk_id_lernende:
          type: integer
          format: int32
        start:
          type: string
          format: date
        ende:
          type: string
          format: date
        beruf:
          type: string
          nullable: true
      required:
        - fk_id_lehrbetrieb
        - fk_id_lernende
        - start
        - ende

# =========================================================================
# PATHS (Endpunkte)
# Die Pfade wurden zu einem Eintrag pro Datei zusammengeführt,
# um den "duplicated mapping key" Fehler zu vermeiden.
# =========================================================================
paths:
  # Endpunkt: LÄNDER
  /Laender.php:
    get:
      tags:
        - Länder
      summary: Alle Länder abrufen (oder Einzelnes Land per ?id=X)
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: integer
          description: ID des Landes (optional)
      responses:
        "200":
          description: Liste aller Länder oder einzelnes Land
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Country'
                  - $ref: '#/components/schemas/Country'
    post:
      tags:
        - Länder
      summary: Neues Land erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Country'
      responses:
        "201":
          description: Land erfolgreich erstellt
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id_country:
                    type: integer
    put:
      tags:
        - Länder
      summary: Land aktualisieren (via ?id=X)
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: ID des Landes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Country'
      responses:
        "200":
          description: Land erfolgreich aktualisiert
    delete:
      tags:
        - Länder
      summary: Land löschen (via ?id=X)
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: ID des Landes
      responses:
        "200":
          description: Land erfolgreich gelöscht

  # Endpunkt: LEHRBETRIEBE
  /Lehrbetriebe.php:
    get:
      tags:
        - Lehrbetriebe
      summary: Alle Lehrbetriebe abrufen (oder Einzelnen Betrieb per ?id=X)
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: integer
          description: ID des Lehrbetriebs (optional)
      responses:
        "200":
          description: Liste aller Lehrbetriebe oder einzelner Betrieb
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Lehrbetrieb'
                  - $ref: '#/components/schemas/Lehrbetrieb'
    post:
      tags:
        - Lehrbetriebe
      summary: Neuen Lehrbetrieb erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lehrbetrieb'
      responses:
        "201":
          description: Lehrbetrieb erfolgreich erstellt
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id_lehrbetrieb:
                    type: integer
    put:
      tags:
        - Lehrbetriebe
      summary: Lehrbetrieb aktualisieren (via ?id=X)
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: ID des Lehrbetriebs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lehrbetrieb'
      responses:
        "200":
          description: Lehrbetrieb erfolgreich aktualisiert
    delete:
      tags:
        - Lehrbetriebe
      summary: Lehrbetrieb löschen (via ?id=X)
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: ID des Lehrbetriebs
      responses:
        "200":
          description: Lehrbetrieb erfolgreich gelöscht

  # Endpunkt: LERNENDE
  /Lernende.php:
    get:
      tags:
        - Lernende
      summary: Alle Lernenden abrufen (oder Einzelnen Lernenden per ?id=X)
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: integer
          description: ID des Lernenden (optional)
      responses:
        "200":
          description: Liste aller Lernenden oder einzelner Lernender
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Lernender'
                  - $ref: '#/components/schemas/Lernender'
    post:
      tags:
        - Lernende
      summary: Neuen Lernenden erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lernender'
      responses:
        "201":
          description: Lernender erfolgreich erstellt
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id_lernende:
                    type: integer
    put:
      tags:
        - Lernende
      summary: Lernenden aktualisieren (via ?id=X)
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: ID des Lernenden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lernender'
      responses:
        "200":
          description: Lernender erfolgreich aktualisiert
    delete:
      tags:
        - Lernende
      summary: Lernenden löschen (via ?id=X)
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: ID des Lernenden
      responses:
        "200":
          description: Lernender erfolgreich gelöscht

  # Endpunkt: DOZENTEN
  /Dozenten.php:
    get:
      tags:
        - Dozenten
      summary: Alle Dozenten abrufen (oder Einzelnen Dozenten per ?id=X)
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: integer
          description: ID des Dozenten (optional)
      responses:
        "200":
          description: Liste aller Dozenten oder einzelner Dozent
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Dozent'
                  - $ref: '#/components/schemas/Dozent'
    post:
      tags:
        - Dozenten
      summary: Neuen Dozenten erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dozent'
      responses:
        "201":
          description: Dozent erfolgreich erstellt
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id_dozent:
                    type: integer
    put:
      tags:
        - Dozenten
      summary: Dozent aktualisieren (via ?id=X)
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: ID des Dozenten
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dozent'
      responses:
        "200":
          description: Dozent erfolgreich aktualisiert
    delete:
      tags:
        - Dozenten
      summary: Dozent löschen (via ?id=X)
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: ID des Dozenten
      responses:
        "200":
          description: Dozent erfolgreich gelöscht

  # Endpunkt: KURSE
  /Kurse.php:
    get:
      tags:
        - Kurse
      summary: Alle Kurse abrufen (oder Einzelnen Kurs per ?id=X)
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: integer
          description: ID des Kurses (optional)
      responses:
        "200":
          description: Liste aller Kurse oder einzelner Kurs
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Kurs'
                  - $ref: '#/components/schemas/Kurs'
    post:
      tags:
        - Kurse
      summary: Neuen Kurs erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Kurs'
      responses:
        "201":
          description: Kurs erfolgreich erstellt
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id_kurs:
                    type: integer
    put:
      tags:
        - Kurse
      summary: Kurs aktualisieren (via ?id=X)
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: ID des Kurses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Kurs'
      responses:
        "200":
          description: Kurs erfolgreich aktualisiert
    delete:
      tags:
        - Kurse
      summary: Kurs löschen (via ?id=X)
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: ID des Kurses
      responses:
        "200":
          description: Kurs erfolgreich gelöscht

  # Endpunkt: KURSE_LERNENDE (Verbindungstabelle)
  /Kurse_Lernende.php:
    get:
      tags:
        - Verbindungen
      summary: Alle Kurs-Lernenden-Verknüpfungen abrufen (oder Einzelne per ?id=X)
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: integer
          description: ID der Verknüpfung (optional)
      responses:
        "200":
          description: Liste aller Verknüpfungen oder einzelne Verknüpfung
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/KursLernender'
                  - $ref: '#/components/schemas/KursLernender'
    post:
      tags:
